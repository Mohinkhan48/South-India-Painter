<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ================================================================
         PRIMARY SEO — React's useSEO hook overrides these per-page via
         document.title / meta[name=description] / link[rel=canonical].
         These values serve as the authoritative homepage defaults and
         are what Googlebot sees on the initial HTML document.
    ================================================================ -->
    <title>South India Painters | Professional Painting Services in Karnataka</title>
    <meta
      name="description"
      content="South India Painters — 27+ years of professional residential, commercial and industrial painting services in Bangalore and across South India. 234+ skilled painters. Free estimates."
    />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#102A43" />

    <!-- Canonical URL — authoritative homepage URL -->
    <link rel="canonical" href="https://southindiapainters.com/" />

    <!-- ================================================================
         OPEN GRAPH
    ================================================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="South India Painters" />
    <meta
      property="og:title"
      content="South India Painters | Professional Painting Services in Karnataka"
    />
    <meta
      property="og:description"
      content="South India Painters — 27+ years of professional residential, commercial and industrial painting services in Bangalore and across South India. 234+ skilled painters. Free estimates."
    />
    <meta property="og:url" content="https://southindiapainters.com/" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://southindiapainters.com/images/hero-bg.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="South India Painters — Professional Painting Services" />

    <!-- ================================================================
         TWITTER / X CARD
    ================================================================ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="South India Painters | Professional Painting Services in Karnataka"
    />
    <meta
      name="twitter:description"
      content="South India Painters — 27+ years of professional residential, commercial and industrial painting services in Bangalore and across South India."
    />
    <meta name="twitter:image" content="https://southindiapainters.com/images/hero-bg.jpg" />
    <meta name="twitter:image:alt" content="South India Painters — Professional Painting Services" />

    <!-- ================================================================

    ================================================================ -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- ================================================================

    ================================================================ -->

    <!-- ================================================================

    ================================================================ -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"

    <!-- Google Maps preconnect (for location section iframe) -->
    <link rel="preconnect" href="https://maps.googleapis.com" />

  <body>
    <div id="root"></div>
